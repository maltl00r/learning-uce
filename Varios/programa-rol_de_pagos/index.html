<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/ui/main.js" type="module"></script>
    <title>Rol de Pagos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">

        <h1>Sistema de pagos centralino</h1>

        <div class="buttons modulo-vista">
            <button id="generate-role" class="yellow-button">Generar rol de pago</button>
            <button id="print-employes" class="green-button">Imprimir rol de pago</button>
            <button id="edit-employes" class="red-button">Editar empleados</button>
        </div>

        <div id="meses-container" class="modulo-vista"></div>

        <div id="botones-empleado" class="buttons modulo-vista oculto" data-vista="empleados">
            <button id="add-employe" class="green-button">Añadir empleado</button>
            <button id="cancel" class="red-button">Cancelar</button>
        </div>

        <div id="lista-empleados-actuales" class="modulo-vista oculto" data-vista="empleados"></div>

    </div>     
</body>

</html>
